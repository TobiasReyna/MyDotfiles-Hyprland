# =============================================================================
# Cava (1.0+) — Configuración raw ASCII para el visualizador de Quickshell
# Solo se ejecuta mientras MediaPopup está abierto y hay audio reproduciéndose.
# =============================================================================

[general]
framerate = 60
bars = 26
autosens = 1
lower_cutoff_freq = 50
higher_cutoff_freq = 10000

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59

[smoothing]
monstercat = 1
waves = 0
noise_reduction = 77
