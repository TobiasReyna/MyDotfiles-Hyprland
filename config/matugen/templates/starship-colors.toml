# =============================================================================
# Starship — Configuración para Arch Linux + paleta Material You (`matugen`)
# Wallpaper origen: {{image}}
#
# NOTA: Editá este template (`config/matugen/templates/starship-colors.toml`)
# si querés ajustar módulos del prompt para que `matugen` conserve tu diseño
# al regenerar `~/.config/starship.toml`.
# =============================================================================

"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
palette = "matugen"

format = """
$os\
$directory\
$git_branch\
$git_status\
$fill\
$nodejs\
$python\
$rust\
$lua\
$docker_context\
$cmd_duration\
$line_break\
$character"""

[os]
disabled = false
format = "[$symbol]($style) "
style = "bold primary"

[os.symbols]
Arch = ""
Linux = ""

[directory]
style = "bold on_surface"
read_only = " 󰌾"
read_only_style = "error"
truncation_length = 3
truncation_symbol = "…/"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
style = "bold secondary"
format = "on [$symbol$branch]($style) "

[git_status]
style = "tertiary"
format = "([$all_status$ahead_behind]($style) )"

[fill]
symbol = " "

[nodejs]
symbol = " "
style = "green"
format = "[$symbol$version]($style) "

[python]
symbol = " "
style = "yellow"
format = "[$symbol$version]($style) "

[rust]
symbol = " "
style = "tertiary"
format = "[$symbol$version]($style) "

[lua]
symbol = " "
style = "primary"
format = "[$symbol$version]($style) "

[docker_context]
symbol = " "
style = "cyan"
only_with_files = true
format = "[$symbol$context]($style) "

[cmd_duration]
min_time = 2000
style = "on_surface_variant"
format = "took [$duration]($style)"

[character]
success_symbol = "[❯](bold primary)"
error_symbol = "[❯](bold error)"
vimcmd_symbol = "[❮](bold secondary)"

# =============================================================================
# Paleta Material You (regenerada dinámicamente por matugen)
# =============================================================================
[palettes.matugen]
primary = "{{colors.primary.default.hex}}"
on_primary = "{{colors.on_primary.default.hex}}"
primary_container = "{{colors.primary_container.default.hex}}"
secondary = "{{colors.secondary.default.hex}}"
tertiary = "{{colors.tertiary.default.hex}}"
background = "{{colors.background.default.hex}}"
surface = "{{colors.surface.default.hex}}"
surface_container = "{{colors.surface_container.default.hex}}"
surface_container_high = "{{colors.surface_container_high.default.hex}}"
on_surface = "{{colors.on_surface.default.hex}}"
on_surface_variant = "{{colors.on_surface_variant.default.hex}}"
outline = "{{colors.outline.default.hex}}"
error = "{{colors.error.default.hex}}"
red = "{{colors.term_red.default.hex}}"
green = "{{colors.term_green.default.hex}}"
yellow = "{{colors.term_yellow.default.hex}}"
cyan = "{{colors.term_cyan.default.hex}}"
