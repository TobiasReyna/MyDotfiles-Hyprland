# =============================================================================
# Hyprlock — Pantalla de bloqueo minimalista (sintaxis hyprlang)
# =============================================================================

source = ~/.config/hypr/colors-hyprlock.conf

$font_sans = Inter
$font_mono = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = md3_decel, 0.05, 0.80, 0.10, 1.00
    animation = fadeIn, 1, 4, md3_decel
    animation = fadeOut, 1, 3, md3_decel
    animation = inputFieldDots, 1, 2, md3_decel
}

# Fondo con blur: `screenshot` funciona siempre (incluso si aún no existe
# `~/.cache/current_wallpaper`). Si preferís usar la imagen directamente sin
# capturar ventanas abiertas, cambiá `path = screenshot` por
# `path = ~/.cache/current_wallpaper` (usa `color = $background` como respaldo).
background {
    monitor =
    path = screenshot
    # path = ~/.cache/current_wallpaper
    color = $background
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.90
    brightness = 0.78
    vibrancy = 0.17
}

# Reloj grande
label {
    monitor =
    text = $TIME
    color = $on_surface
    font_size = 96
    font_family = $font_sans
    shadow_passes = 2
    shadow_size = 6
    shadow_color = $shadow

    position = 0, 180
    halign = center
    valign = center
}

# Fecha en español
label {
    monitor =
    text = cmd[update:60000] LC_TIME=es_AR.UTF-8 date +"%A, %d de %B de %Y" | sed 's/./\U&/'
    color = $on_surface_variant
    font_size = 22
    font_family = $font_sans
    shadow_passes = 1
    shadow_size = 4
    shadow_color = $shadow

    position = 0, 95
    halign = center
    valign = center
}

# Campo de contraseña redondeado con feedback visual
input-field {
    monitor =
    size = 300, 52
    outline_thickness = 2
    dots_size = 0.26
    dots_spacing = 0.25
    dots_center = true
    dots_rounding = -1

    outer_color = $primary $secondary 45deg
    inner_color = $surface_container
    font_color = $on_surface
    check_color = $tertiary $primary 120deg
    fail_color = $error
    capslock_color = $tertiary

    fade_on_empty = false
    fade_timeout = 1000
    rounding = -1
    font_family = $font_mono

    placeholder_text = <span foreground="##c5c6d0">Contraseña...</span>
    fail_text = <i>Contraseña incorrecta ($ATTEMPTS)</i>
    check_text = Verificando...

    position = 0, -60
    halign = center
    valign = center
}

# Indicador sutil de usuario / distribución de teclado
label {
    monitor =
    text = $USER · $LAYOUT
    color = $on_surface_variant
    font_size = 13
    font_family = $font_mono

    position = 0, -120
    halign = center
    valign = center
}
