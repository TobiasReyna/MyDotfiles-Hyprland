# =============================================================================
# Hypridle — Gestión de inactividad, bloqueo y energía (sintaxis hyprlang)
# Nota Hyprland 0.57+: el dispatcher DPMS por IPC usa sintaxis Lua
# `hyprctl dispatch 'hl.dsp.dpms({action = "off"})'`.
# =============================================================================

general {
    lock_cmd = pidof hyprlock || hyprlock                             # Evita abrir múltiples instancias de hyprlock
    before_sleep_cmd = loginctl lock-session                          # Bloquear antes de suspender
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' # Encender pantalla al reanudar
}

# 2.5 min (150s): reducir brillo al 10% (evita apagar retroiluminación en OLED)
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# 5 min (300s): bloquear sesión con hyprlock
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5.5 min (330s): apagar pantalla (DPMS off)
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 15 min (900s): suspender laptop
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
